services:
  db:
    image: postgis/postgis:16-3.4
    container_name: argus-db
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  argus_postgres_data:

