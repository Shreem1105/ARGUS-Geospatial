[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-backend"
version = "0.1.0"
description = "Initial FastAPI backend for ARGUS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "celery>=5.4.0,<6.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "geoalchemy2>=0.15.2,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "numpy>=2.3.2,<3.0.0",
  "pillow>=11.3.0,<12.0.0",
  "planetary-computer>=1.0.0,<2.0.0",
  "pyproj>=3.7.2,<4.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "pystac-client>=0.9.0,<1.0.0",
  "rasterio>=1.4.3,<2.0.0",
  "redis>=5.2.0,<6.0.0",
  "shapely>=2.1.1,<3.0.0",
  "torch>=2.14.0,<3.0.0",
  "torchgeo>=0.8.1,<1.0.0",
  "psycopg[binary]>=3.2.10,<4.0.0",
  "SQLAlchemy>=2.0.43,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2,<9.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
